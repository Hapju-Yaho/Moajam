      summary: API 프로세스 상태
      description: |-
        목표 계약 · P0 · 권한: PUBLIC. 아직 이 계약의 구현·실연동 검증이 완료되지 않았습니다.

        공통 인증·scope·입력 검증과 오류 계약을 적용합니다.
      x-implementation-status: planned
      x-phase: P0
      x-permission: PUBLIC
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
