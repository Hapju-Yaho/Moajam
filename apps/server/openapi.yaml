openapi: 3.1.0
info:
  title: Moajam API · 목표 설계
  version: 0.2.0-design
  description: >-
    2026-09-28 서비스 전체 목표 계약. 모든 항목은 planned이며 기존 동일 경로의 실제 응답과 다를 수 있습니다. 구현 상태는
    apps/server/docs/implementation-status.md를 참고하세요. 이 설계 Viewer에서는 요청을 실행하지 않습니다. 정식 로그인은 POST /auth/kakao에 code와 redirectUri를 보내 서비스 JWT를 발급받습니다.
    이메일·비밀번호 인증은 제공하지 않습니다. 기본 인증은 카카오이며 실제 인증 API와 설정은 docs/authentication.md를 참고하세요.
servers:
  - url: http://localhost:3000/v1
    description: 로컬 API — 목표 경로, 구현 여부 별도 확인
security:
  - bearerAuth: []
tags:
  - name: System
    description: P0 · 상태 확인
  - name: Me
    description: P0 · 계정·개인 홈·설정
  - name: Workspaces
    description: P0 · 밴드·초대·멤버
  - name: Recommendations
    description: P0 · 추천·반응·댓글·채택
  - name: Songs
    description: P0 · 곡·배정·준비
  - name: Opinions
    description: P0 · 의견·결정·할 일
  - name: Schedules
    description: P0 · 개인 일정·통합 캘린더
  - name: Rehearsals
    description: P0 · 합주·참석·세트리스트
  - name: Notifications
    description: P0 · 앱 내 알림
  - name: Resources
    description: P1 · 자료·레퍼런스·업로드
  - name: Practice
    description: P1 · 타임라인·악보 Sync·녹음
  - name: Jobs
    description: P1 · 일반 Stem 작업
  - name: PersonalTools
    description: P2 · 개인 음원 추출
  - name: Scores
    description: P2 · 개인 구조화 악보
