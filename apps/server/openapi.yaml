components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Moajam 서비스 JWT access token. 서버 전용 키를 넣지 않는다.
  schemas:
    Role:
      type: string
      enum:
        - OWNER
        - MEMBER
    Instrument:
      type: string
      enum:
        - VOCAL
        - GUITAR
        - BASS
        - DRUMS
        - KEYBOARD
        - OTHER
    PreparationStatus:
      type: string
      enum:
        - NOT_READY
        - PRACTICING
        - READY
    RecommendationStatus:
      type: string
      enum:
        - RECOMMENDED
        - CANDIDATE
        - ADOPTED
        - HOLD
    JobStatus:
      type: string
      enum:
        - QUEUED
        - PROCESSING
        - PREPARING_AUDIO
        - COMPLETED
        - FAILED
        - CANCELLED
    ExtractionStatus:
      type: string
      enum:
        - QUEUED
        - ANALYZING
        - SEPARATING
        - READY
        - FAILED
        - CANCELLED
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4000
          example: https://example.com/reference
        title:
          type: string
          description: 오류 요약
          maxLength: 200
        status:
          type: integer
          description: HTTP 상태
          minimum: 400
          maximum: 599
        code:
          type: string
          description: 기계 판독 오류 코드
          maxLength: 80
          example: REVISION_CONFLICT
        detail:
          type: string
          description: 사용자용 상세 설명
          maxLength: 2000
        traceId:
          type: string
          description: 추적 ID
          maxLength: 128
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: 필드 경로
                maxLength: 200
              reason:
                type: string
                description: 실패 이유 코드
                maxLength: 200
              message:
                type: string
                description: 설명
                maxLength: 200
            required:
              - field
              - reason
              - message
            additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - traceId
      additionalProperties: false
      description: 공통 오류. 구현된 필터와 목표 계약의 차이는 implementation-status 문서를 참고.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        timestamp:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
      required:
        - status
        - timestamp
      additionalProperties: false
      description: 프로세스 상태
    Readiness:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
        database:
          type: string
          enum:
            - up
            - down
        timestamp:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
      required:
        - status
        - database
        - timestamp
      additionalProperties: false
      description: DB 등 필수 의존성 준비 상태
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        displayName:
          type: string
          description: 표시 이름
          maxLength: 80
          example: 모아
        avatarUrl:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4000
          example: https://example.com/reference
        createdAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
      required:
        - id
        - displayName
        - createdAt
        - updatedAt
      additionalProperties: false
      description: 현재 사용자. 카카오 코드를 백엔드에서 교환하고 자체 JWT를 발급하며 비밀번호를 받거나 저장하지 않는다.
    Preference:
      type: object
      properties:
        timeZone:
          type: string
          description: IANA 시간대
          maxLength: 80
          example: Asia/Seoul
        locale:
          type: string
          description: 언어
          maxLength: 20
          example: ko-KR
        inAppNotifications:
          type: boolean
          description: 앱 내 알림 수신
      required:
        - timeZone
        - locale
        - inAppNotifications
      additionalProperties: false
      description: 본인 설정
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        name:
          type: string
          description: 밴드명
          maxLength: 80
          example: 주말 합주단
        memberCount:
          type: integer
          description: 현재 멤버 수
          minimum: 1
        myRole:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
        revision:
          type: integer
          description: 현재 revision. 수정 성공 시 1 증가.
          minimum: 1
      required:
        - id
        - name
        - memberCount
        - myRole
        - createdAt
        - updatedAt
        - revision
      additionalProperties: false
      description: 밴드 요약
    Member:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        displayName:
          type: string
          description: 표시 이름
          maxLength: 80
        role:
          $ref: '#/components/schemas/Role'
        part:
          type: string
          description: 밴드 기본 파트
          maxLength: 80
        joinedAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
      required:
        - userId
        - displayName
        - role
        - part
        - joinedAt
      additionalProperties: false
      description: 밴드 멤버. part는 기본 파트; 곡 배정과 다르다.
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
        revoked:
          type: boolean
          description: 철회 여부
        createdAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
      required:
        - id
        - expiresAt
        - revoked
        - createdAt
      additionalProperties: false
      description: 목록에는 token/tokenHash를 노출하지 않는다.
    InvitationIssued:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        token:
          type: string
          description: 초대 토큰. 로그에 남기지 않는다.
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
      required:
        - id
        - token
        - expiresAt
      additionalProperties: false
      description: 원문 토큰은 최초 발급 응답에만 제공.
    WorkspaceJoined:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
      required:
        - workspaceId
      additionalProperties: false
      description: 기존 가입자도 같은 결과
    ReactionSummary:
      type: object
      properties:
        likeCount:
          type: integer
          description: 좋아요 수
          minimum: 0
        adoptionVoteCount:
          type: integer
          description: 채택 추천 수
          minimum: 0
        likedByMe:
          type: boolean
          description: 내 좋아요
        adoptionVotedByMe:
          type: boolean
          description: 내 채택 추천
      required:
        - likeCount
        - adoptionVoteCount
        - likedByMe
        - adoptionVotedByMe
      additionalProperties: false
      description: 서버 집계. 클라이언트는 개수를 지정하지 않는다.
    Recommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        workspaceId:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        authorId:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        title:
          type: string
          description: 제목
          maxLength: 200
          example: 가을 정기 합주
          minLength: 1
        artist:
          type: string
          description: 아티스트
          maxLength: 200
          example: Oasis
        reason:
          type: string
          description: 추천 이유
          maxLength: 5000
        referenceUrl:
          type: string
          format: uri
          pattern: ^https?://
          maxLength: 4000
          example: https://example.com/reference
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        holdReason:
          type: string
          description: 보류 이유
          maxLength: 2000
        reactions:
          $ref: '#/components/schemas/ReactionSummary'
        commentCount:
          type: integer
          description: 댓글 수
          minimum: 0
        adoptedSongId:
          type: string
          format: uuid
          description: 리소스 UUID
          example: 3e259fa0-b67d-4a3e-9589-4b7f7527c128
        createdAt:
          type: string
          format: date-time
          example: '2026-10-03T05:00:00Z'
        updatedAt:
          type: string
          format: date-time
