[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=optional"

[[redirects]]
  from = "/api/youtube-oembed"
  to = "https://www.youtube.com/oembed"
  status = 200
  force = true

# Let the app handle direct links and refreshes on client-side routes.
# Keep this after API proxy rules; existing static files still take precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
